name: Language card

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/language_card.py
      - scripts/terminal_card.py
      - assets/cat.jpg
      - languages.config.json
      - .github/workflows/language-card.yml

permissions:
  contents: write

concurrency:
  group: language-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SVGs
        run: python3 scripts/language_card.py --config languages.config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate terminal card
        run: |
          pip install --quiet pillow numpy
          python3 scripts/terminal_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git add assets/
          if git diff --cached --quiet; then
            echo "Language card unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards"
          git push
